name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS, because internal/ui is cgo against the system status-bar APIs.
    # The rest of the suite is pure Go and would run anywhere.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - run: make check
      - run: make build
